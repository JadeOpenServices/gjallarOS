# Builds the packages GjallarOS patches (flake package `prebuilt`) for each
# release tag and adds them to the signed Nix cache kept as files of the
# `nix-cache` release, so machines download them instead of compiling for
# hours. Setup: README "Release cache".
name: release cache

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'JadeOpenServices/gjallarOS'
    runs-on: ubuntu-latest
    # Holds NIX_SIGNING_KEY. Its rules (v* tags only, required reviewer)
    # decide whether this job ever sees it.
    environment: release-cache
    permissions:
      contents: write
    timeout-minutes: 360
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      # Room for the Nix store: the runner image ships about 14 GB free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Build
        run: nix build --print-build-logs --out-link result '.?submodules=1#prebuilt'

      - name: Sign into a file cache
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          key="$RUNNER_TEMP/cache.key"
          printf '%s\n' "$NIX_SIGNING_KEY" > "$key"
          nix copy --to "file://$PWD/cache?compression=zstd&secret-key=$key" ./result
          rm -f "$key"

      # nix copy writes the whole closure. Machines get everything
      # cache.nixos.org has from there, so only the rest is kept.
      - name: Keep what cache.nixos.org lacks
        working-directory: cache
        run: |
          ls *.narinfo | sed 's/\.narinfo$//' | xargs -P 16 -I{} sh -c '
            if curl -sfI -o /dev/null "https://cache.nixos.org/{}.narinfo"; then
              rm "$(sed -n "s/^URL: //p" {}.narinfo)" {}.narinfo
            fi'
          # Release files cannot sit in folders, so the NARs move next to the
          # narinfo files. The signature covers store path, NAR hash, size and
          # references, not the URL.
          find nar -type f -exec mv -t . {} +
          sed -i 's|^URL: nar/|URL: |' *.narinfo
          printf 'StoreDir: /nix/store\nWantMassQuery: 1\nPriority: 50\n' > nix-cache-info
          echo "$(ls *.narinfo | wc -l) store paths for the cache"

      # NARs go up before the narinfo files that point at them: a machine that
      # finds a narinfo but not its NAR fails the build instead of compiling.
      - name: Upload new files to the nix-cache release
        working-directory: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nix-cache > /dev/null 2>&1 ||
            gh release create nix-cache --prerelease --title "Nix cache" \
              --notes 'Signed Nix binary cache for GjallarOS packages, not a release. See README "Release cache".'
          gh release view nix-cache --json assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/have"
          for files in '*.nar.zst' '*.narinfo' nix-cache-info; do
            ls $files | sort | comm -23 - "$RUNNER_TEMP/have" | xargs -r gh release upload nix-cache
          done
