# Builds the packages GjallarOS patches (flake package `prebuilt`) for each
# release tag and pushes them to the release cache, so machines download
# them instead of compiling for hours. Setup: README "Release cache".
name: release cache

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'JadeOpenServices/gjallarOS'
    runs-on: ubuntu-latest
    # Holds CACHIX_AUTH_TOKEN and CACHIX_SIGNING_KEY. Its rules (v* tags only,
    # required reviewer) decide whether this job ever sees them.
    environment: release-cache
    timeout-minutes: 360
    steps:
      # Room for the Nix store: the runner image ships about 14 GB free.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      # Daemon mode pushes only what this job builds, not what it downloaded
      # from cache.nixos.org.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}

      - name: Build
        run: nix build --print-build-logs '.?submodules=1#prebuilt'
